name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SemVer tag to release (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Validate and publish
    runs-on: ubuntu-24.04

    steps:
      - name: Resolve tag
        id: release
        env:
          PUSH_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          MANUAL_TAG: ${{ inputs.tag || '' }}
        run: |
          tag="${PUSH_TAG:-$MANUAL_TAG}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Validate project version
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag_core="${TAG#v}"
          tag_core="${tag_core%%-*}"
          tag_core="${tag_core%%+*}"
          if [[ "$version" != "$tag_core" ]]; then
            echo "VERSION ($version) does not match tag ($TAG)" >&2
            exit 1
          fi

      - name: Create release archives
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p release
          prefix="obs-teleprompter-${TAG#v}/"
          git archive --format=tar.gz --prefix="$prefix" -o "release/obs-teleprompter-${TAG#v}.tar.gz" "$TAG"
          git archive --format=zip --prefix="$prefix" -o "release/obs-teleprompter-${TAG#v}.zip" "$TAG"
          cd release
          sha256sum *.tar.gz *.zip > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease+=(--prerelease)
          gh release create "$TAG" release/* \
            --verify-tag \
            --generate-notes \
            --title "OBS Teleprompter $TAG" \
            "${prerelease[@]}"
